plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.necauqua.mods'
version = '1.0.0'

base {
    archivesName = 'subpocket'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.252'

    parchment {
        mappingsVersion = '2024.11.10'
        minecraftVersion = '1.21.1'
    }
}

repositories {
    mavenCentral()
}

runs {
    configureEach {
        ideName = 'NeoForge'
    }

    client {
        client()
    }

    server {
        server()
    }

    data {
        data()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    archiveClassifier = 'universal'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
